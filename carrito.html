<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Carrito - CampusShop</title>
  <link rel="stylesheet" href="Css/Estiloscarrito.css">

</head>
<body class="body-carrito">

  <main class="tarjeta-carrito-modal">
    
    <header class="header-carrito">
      <a href="index.html" class="btn-volver material-symbols-outlined">arrow_back</a>

    <div class="contenido-vacio">

      <p>Parece que aún no has añadido nada. ¡Explora nuestros productos!</p>
    </div>

    <div class="footer-carrito">
      <a href="index.html" class="btn-explorar">Explorar Catálogo</a>
    </div>
