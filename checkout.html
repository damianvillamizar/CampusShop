<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - CampusShop</title>
  <link rel="stylesheet" href="Css/Estiloscheckout.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body class="body-checkout">

  <main class="modal-checkout">
    

    <header class="header-modal-checkout">
      <a href="carritolleno.html" class="btn-icon material-symbols-outlined">arrow_back</a>
      <h2>Checkout</h2>
      <div class="espaciador-header"></div>
    </header>

    <div class="cuerpo-scroll-checkout">
      
      <section class="seccion-checkout">
        <h3>Envío</h3>
        
        <div class="grupo-campo">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" placeholder="Ingresa tu nombre completo">
        </div>

        <div class="grupo-campo">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" placeholder="Ingresa tu dirección">
        </div>

        <div class="grupo-campo">
          <label for="ciudad">Ciudad</label>
          <input type="text" id="ciudad" placeholder="Tu ciudad">
        </div>
      </section>

     
      <section class="seccion-checkout">
        <h3>Método de Pago</h3>
        
        <div class="opciones-pago">
          
          <label class="tarjeta-pago">
            <input type="radio" name="pago" value="visa" checked class="radio-pago-oculto">
            <div class="contenido-pago">
              <span class="material-symbols-outlined">credit_card</span>
              <span>Nequi</span>
            </div>
          </label>

          <label class="tarjeta-pago">
            <input type="radio" name="pago" value="mascard" class="radio-pago-oculto">
            <div class="contenido-pago">
              <span class="material-symbols-outlined">credit_card</span>
              <span>MasterCard</span>
            </div>
          </label>

          <label class="tarjeta-pago">
            <input type="radio" name="pago" value="peypal" class="radio-pago-oculto">
            <div class="contenido-pago">
              <span class="material-symbols-outlined">account_balance_wallet</span>
              <span>Peypal</span>
            </div>
          </label>

        </div>
      </section>

      <section class="tarjeta-resumen-orden">
        <h3>Resumen de tu Orden</h3>
        
        <div class="lista-items-resumen">
          
          <div class="item-resumen">
            <img src="imagenes/pantalones.jpg" alt="pantalones">
            <div class="info-item-resumen">
              <h4>pantalones</h4>
              <p>Cantidad: 1</p>
            </div>
            <span class="precio-item-resumen">$100.00</span>
          </div>

          <div class="item-resumen">
            <img src="imagenes/airpods.jpg" alt="Auriculares Premium">
            <div class="info-item-resumen">
              <h4>Auriculares Premium</h4>
              <p>Cantidad: 1</p>
            </div>
            <span class="precio-item-resumen">$99.50</span>
          </div>

        </div>

        <div class="linea-total-resumen">
          <span>Total</span>
          <span class="monto-total">$199.50</span>
        </div>
      </section>

      <a href="historiallleno.html" class="btn-pagar-orden">Pagar $199.50</a>

    </div>

  </main>

</body>
</html>
