<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - CampusShop</title>

    <link rel="stylesheet"
          href="Css/Estilosperfil2.css">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>


<body class="body-perfil">

    <main class="tarjeta-login">
        <header class="header-login">

            <a href="Index.html" class="btn-volver-login material-symbols-outlined">arrow_back</a>
            <h2>
                Mi Perfil
            </h2>

        </header>

        <section class="contenido-login">


            <div class="icono-perfil">

                <span class="material-symbols-outlined">
                    account_circle
                </span>

            </div>


            <h1>
                Iniciar Sesión
            </h1>

            <p class="texto-login">
                Ingresa a tu cuenta de CampusShop
            </p>

            <form class="form-login">

                <div class="campo-login">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <div class="input-con-icono">

                        <span class="material-symbols-outlined">
                            mail
                        </span>

                        <input
                            type="email"
                            id="correo"
                            placeholder="correo@ejemplo.com"
                            required>

                    </div>

                </div>

                <div class="campo-login">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-con-icono">

                        <span class="material-symbols-outlined">
                            lock
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••"
                            required>

                    </div>

                </div>

                <div class="opciones-login">

                    <label class="recordarme">

                        <input
                            type="checkbox"
                            id="recordar">

                        <span>
                            Recordarme
                        </span>

                    </label>

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>
                <button type="button"class="btn-iniciar"onclick="window.location.href='intexperfil.html'">Iniciar Sesión</button>
            </form>

            <div class="registro-login">
                <span>
                    ¿No tienes una cuenta?
                </span>
                <a href="#">
                    Crear cuenta
                </a>
            </div>

        </section>

    </main>

</body>

</html>
